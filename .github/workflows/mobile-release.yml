name: Mobile release

# Store publication is upstream-only (ADR-0027). The job condition below is the second
# fence, not the first: `openbot mobile release` already refuses the official EAS project
# from any remote other than trytilde/openbot, and a fork has no EXPO_TOKEN anyway.
on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: ios
        options: [ios, android, all]
      profile:
        description: eas.json build profile
        type: choice
        default: production
        options: [production, preview]
      submit:
        description: Submit the build to the store after it succeeds
        type: boolean
        default: true

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'trytilde/openbot'
    runs-on: ubuntu-latest
    # An EAS build runs on EAS infrastructure and this job only waits for it, but iOS
    # builds regularly queue.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.15.0
        with:
          node-version: 24
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # An iOS build costs plan minutes and a queue wait, so the repository gates run
      # first: a tree that cannot typecheck must not reach EAS.
      - name: Check
        run: vp run --filter openbot start -- check

      # A tag release always builds both platforms and submits; a manual run decides.
      - name: Build and submit
        run: >
          vp run --filter openbot start -- mobile release build
          --platform ${{ inputs.platform || 'all' }}
          --profile ${{ inputs.profile || 'production' }}
          ${{ (github.event_name == 'push' || inputs.submit) && '--submit' || '' }}
          --yes
        env:
          # A robot access token from expo.dev. EAS CLI reads it directly, so no login
          # step runs here and no credential is written to the runner's filesystem.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
