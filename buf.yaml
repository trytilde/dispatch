version: v2
modules:
  - path: packages/contracts/proto
lint:
  use:
    - STANDARD
  except:
    # The provider-neutral API intentionally returns stable domain messages
    # from related RPCs and shares Exec across the control and box surfaces.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
