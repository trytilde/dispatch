syntax = "proto3";

package openbot.v1;

service InstallationService {
  rpc GetStatus(GetInstallationStatusRequest) returns (InstallationStatus);
  rpc Configure(ConfigureInstallationRequest) returns (InstallationStatus);
  rpc SetOnboardingStep(SetOnboardingStepRequest) returns (InstallationStatus);
}

service AgentService {
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgent(GetAgentRequest) returns (Agent);
  rpc UpdateAgent(UpdateAgentRequest) returns (Agent);
}

service ChatService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc CreateSession(CreateSessionRequest) returns (ChatSession);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc SendMessage(SendMessageRequest) returns (ListMessagesResponse);
  rpc Interrupt(InterruptChatRequest) returns (InterruptChatResponse);
}

service ProviderService {
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc CheckProvider(CheckProviderRequest) returns (ProviderStatus);
}

service SandboxService {
  rpc CreateSandbox(CreateSandboxRequest) returns (Sandbox);
  rpc GetSandbox(GetSandboxRequest) returns (Sandbox);
  rpc Exec(ExecRequest) returns (ExecResponse);
  rpc GetDesktop(GetDesktopRequest) returns (DesktopEndpoint);
  rpc Checkpoint(CheckpointRequest) returns (Sandbox);
  rpc StopSandbox(StopSandboxRequest) returns (Sandbox);
}

service BoxService {
  rpc Health(BoxHealthRequest) returns (BoxHealthResponse);
  rpc Exec(ExecRequest) returns (ExecResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc Screenshot(ScreenshotRequest) returns (ScreenshotResponse);
  rpc Input(InputRequest) returns (InputResponse);
  rpc ListPorts(ListPortsRequest) returns (ListPortsResponse);
}

message GetInstallationStatusRequest {}

enum InstallationPhase {
  INSTALLATION_PHASE_UNSPECIFIED = 0;
  INSTALLATION_PHASE_LOCKED = 1;
  INSTALLATION_PHASE_TILDE = 2;
  INSTALLATION_PHASE_ONBOARDING = 3;
  INSTALLATION_PHASE_READY = 4;
}

message InstallationStatus {
  InstallationPhase phase = 1;
  string onboarding_step = 2;
  bool tilde_configured = 3;
  bool model_configured = 4;
  string public_origin = 5;
  string environment_provider = 6;
  bool environment_provider_configured = 7;
}

message ConfigureInstallationRequest {
  string tilde_api_key = 1;
  string tilde_webhook_signing_key = 2;
  string tilde_org_id = 3;
  string tilde_team_id = 4;
  string tilde_agent_id = 5;
  string tilde_ui_provider_id = 6;
  string openai_api_key = 7;
  string openai_model = 8;
  string vercel_api_token = 9;
  string tilde_runtime_mcp_server_id = 10;
  string tilde_skill_registry_id = 11;
}

message SetOnboardingStepRequest {
  string step = 1;
}

message Agent {
  string id = 1;
  string display_name = 2;
  string status = 3;
  string endpoint_url = 4;
  string created_at = 5;
  string updated_at = 6;
}

message ListAgentsRequest {}
message ListAgentsResponse { repeated Agent agents = 1; }
message GetAgentRequest { string id = 1; }
message UpdateAgentRequest {
  string id = 1;
  string display_name = 2;
}

message ChatSession {
  string id = 1;
  string agent_id = 2;
  string title = 3;
  bool unread = 4;
  string created_at = 5;
  string updated_at = 6;
}
message ChatMessage {
  string id = 1;
  string session_id = 2;
  string role = 3;
  string text = 4;
  string created_at = 5;
}
message ListSessionsRequest { string agent_id = 1; }
message ListSessionsResponse { repeated ChatSession sessions = 1; }
message CreateSessionRequest {
  string agent_id = 1;
  string title = 2;
}
message ListMessagesRequest { string session_id = 1; }
message ListMessagesResponse { repeated ChatMessage messages = 1; }
message SendMessageRequest {
  string agent_id = 1;
  string session_id = 2;
  string text = 3;
}
message InterruptChatRequest { string session_id = 1; }
message InterruptChatResponse { bool interrupted = 1; }

enum ProviderKind {
  PROVIDER_KIND_UNSPECIFIED = 0;
  PROVIDER_KIND_AI = 1;
  PROVIDER_KIND_SANDBOX = 2;
  PROVIDER_KIND_AGENT = 3;
  PROVIDER_KIND_CHAT = 4;
  PROVIDER_KIND_ENVIRONMENT = 5;
  PROVIDER_KIND_TOOL = 6;
  PROVIDER_KIND_WORKSPACE_STORAGE = 7;
}

message ProviderStatus {
  string id = 1;
  string display_name = 2;
  ProviderKind kind = 3;
  bool configured = 4;
  bool healthy = 5;
  repeated string capabilities = 6;
  string message = 7;
}
message ListProvidersRequest {}
message ListProvidersResponse { repeated ProviderStatus providers = 1; }
message CheckProviderRequest { string id = 1; }

enum SandboxState {
  SANDBOX_STATE_UNSPECIFIED = 0;
  SANDBOX_STATE_STARTING = 1;
  SANDBOX_STATE_RUNNING = 2;
  SANDBOX_STATE_STOPPED = 3;
  SANDBOX_STATE_FAILED = 4;
}

message Sandbox {
  string id = 1;
  string provider_id = 2;
  SandboxState state = 3;
  string created_at = 4;
  string checkpoint_id = 5;
}
message CreateSandboxRequest {
  string image = 1;
}
message GetSandboxRequest {}
message ExecRequest {
  string command = 1;
  repeated string arguments = 2;
  uint32 timeout_seconds = 3;
}
message ExecResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
}
message GetDesktopRequest {}
message DesktopEndpoint {
  string url = 1;
  string expires_at = 2;
}
message CheckpointRequest {}
message StopSandboxRequest {}

message BoxHealthRequest {}
message BoxHealthResponse { bool healthy = 1; string version = 2; }
message ReadFileRequest { string path = 1; }
message ReadFileResponse { bytes content = 1; }
message WriteFileRequest { string path = 1; bytes content = 2; }
message WriteFileResponse { uint64 bytes_written = 1; }
message ScreenshotRequest {}
message ScreenshotResponse { bytes png = 1; }
message InputRequest { string action = 1; string payload_json = 2; }
message InputResponse { bool accepted = 1; }
message ListPortsRequest {}
message Port { uint32 port = 1; string protocol = 2; string url = 3; }
message ListPortsResponse { repeated Port ports = 1; }
