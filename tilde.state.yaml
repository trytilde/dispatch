metadata:
  name: openbot
  description: Shared ChatKit gateway for an OpenBot installation.
variables:
  CHATKIT_ENDPOINT_URL:
    type: string
    description: The deployed OpenBot /api/tilde/chatkit URL.
resources:
  chatkit/agent/openbot-gateway:
    configuration:
      local_running_endpoint: false
      provider: chatkit.http-vercel-ai-sdk
      streaming: true
      timeout_ms: 300000
    displayName: OpenBot Gateway
    enabled: true
    endpointUrl: ${CHATKIT_ENDPOINT_URL}
  chatkit/provider/openbot-web:
    refs:
      default_agent: chatkit/agent/openbot-gateway
    defaultAgentInboxId: openbot
    desiredEnabled: true
    displayName: OpenBot Web
    providerConfiguration: {}
    providerId: chatkit.channel.vercel-ui
